<svg xmlns="http://www.w3.org/2000/svg" width="720" height="740" viewBox="0 0 720 740" role="img" aria-labelledby="title desc">
<title id="title">Give separate records shared meaning</title><desc id="desc">Conceptual data path · source records to business-facing views. Separate source systems: Account and deal records · contracts · product activity; Keep the source records: Retain the inputs used to build shared definitions.; Define what the records mean: Customer history · measured coverage · activity counts; Expose those meanings to reports: Combine definitions into views people can query.</desc>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d8d0c2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c2410c" stroke-width="1.3"/></marker></defs>
<rect width="720" height="740" fill="#faf8f3"/><rect width="720" height="740" fill="url(#dots)"/>
<rect x="24" width="672" height="740" fill="#faf8f3" stroke="#d8d0c2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1c1a16">
<text x="52" y="49" font-size="27" font-weight="600">Give separate records shared meaning</text>
<text x="52" y="79" font-size="17" fill="#5b564c">Conceptual data path · source records to business-facing views</text>
<path d="M24 103H696" stroke="#d8d0c2"/><rect x="21" y="100" width="6" height="6" fill="#faf8f3" stroke="#d8d0c2"/>
<rect x="52" y="126" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="153" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">STARTING POINT</text>
<text x="76" y="179" font-size="23" font-weight="500">Separate source systems</text>
<text x="76" y="205" font-size="17" fill="#5b564c">Account and deal records · contracts · product activity</text>
<path d="M360 226V251" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52" y="256" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="283" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">BRONZE</text>
<text x="76" y="309" font-size="23" font-weight="500">Keep the source records</text>
<text x="76" y="335" font-size="17" fill="#5b564c">Retain the inputs used to build shared definitions.</text>
<path d="M360 356V381" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52" y="386" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="413" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">SILVER</text>
<text x="76" y="439" font-size="23" font-weight="500">Define what the records mean</text>
<text x="76" y="465" font-size="17" fill="#5b564c">Customer history · measured coverage · activity counts</text>
<path d="M360 486V511" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52" y="516" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="543" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">GOLD</text>
<text x="76" y="569" font-size="23" font-weight="500">Expose those meanings to reports</text>
<text x="76" y="595" font-size="17" fill="#5b564c">Combine definitions into views people can query.</text>
<text x="52" y="705" font-size="16" fill="#5b564c">Preserve the distinctions: unknown is not zero; a renewal is not a first sale.</text></g></svg>
