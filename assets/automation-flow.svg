<text x="76" y="413" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">PERSON</text>
<text x="76" y="439" font-size="23" font-weight="500">Review the list and approve its proposal ID</text>
<text x="76" y="465" font-size="17" fill="#5b564c">Approval refers to the saved list, not a newly generated one.</text>
<path d="M360 486V511" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52" y="516" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="543" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">APPLICATION TRANSACTION</text>
