<text x="76" y="725" font-size="17" fill="#5b564c">Applied accounts · accounts skipped because their owner changed</text>
<text x="52" y="835" font-size="16" fill="#5b564c">Models interpret; stored state carries the person’s decision into execution.</text></g></svg>
