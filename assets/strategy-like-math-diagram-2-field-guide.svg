<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Three worker agents with different roles each propose one edit to the scorer. Reverted and retired ideas land in an uncapped set of threads, and the next add is drawn from there." style="color:#1c1a16"><rect data-role="paper-background" x="0" y="0" width="900" height="420" fill="#faf8f3"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"></path></marker><marker id="a2t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b564c"></path></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor" stroke-width="1.5">
<rect x="30" y="40" width="200" height="54" rx="6" fill="#fffefb" stroke="currentColor"></rect>
<text x="130" y="59" text-anchor="middle" font-weight="600" fill="#c2410c">A  challenger</text>
<text x="130" y="75" text-anchor="middle" font-size="11" opacity=".85">finds the fact that breaks an idea,</text>
<text x="130" y="88" text-anchor="middle" font-size="11" opacity=".85">merges or retires overlaps</text>
<rect x="30" y="104" width="200" height="54" rx="6" fill="#fffefb" stroke="currentColor"></rect>
<text x="130" y="123" text-anchor="middle" font-weight="600" fill="#c2410c">C  designer</text>
<text x="130" y="139" text-anchor="middle" font-size="11" opacity=".85">writes what the preparer, controller</text>
<text x="130" y="152" text-anchor="middle" font-size="11" opacity=".85">or auditor does once the agent is in</text>
<rect x="30" y="168" width="200" height="54" rx="6" fill="#fffefb" stroke="currentColor"></rect>
<text x="130" y="187" text-anchor="middle" font-weight="600" fill="#c2410c">B  explorer</text>
<text x="130" y="203" text-anchor="middle" font-size="11" opacity=".85">brings facts from laws, standards,</text>
<text x="130" y="216" text-anchor="middle" font-size="11" opacity=".85">studies, products, and joins two ideas</text>
<line x1="230" y1="195" x2="278" y2="195" stroke="currentColor" marker-end="url(#a2)"></line>
<text x="254" y="186" text-anchor="middle" font-size="11">one edit</text>
<rect x="280" y="40" width="200" height="190" rx="8" fill="#fffefb" stroke="#c2410c" stroke-width="2"></rect>
<text x="380" y="62" text-anchor="middle" font-weight="600" fill="#c2410c">Scorer</text>
<text x="380" y="100" text-anchor="middle" font-size="11" opacity=".85">source gate</text>
<text x="380" y="140" text-anchor="middle" font-size="11" opacity=".85">judge</text>
<text x="380" y="180" text-anchor="middle" font-size="11" opacity=".85">keep or revert</text>
<line x1="380" y1="108" x2="380" y2="124" stroke="currentColor" marker-end="url(#a2)"></line>
<line x1="380" y1="148" x2="380" y2="164" stroke="currentColor" marker-end="url(#a2)"></line>
<rect x="560" y="60" width="200" height="60" rx="8" fill="#fffefb" stroke="currentColor" stroke-width="2"></rect>
<text x="660" y="85" text-anchor="middle" font-weight="600" fill="#c2410c">Thesis</text>
<text x="660" y="104" text-anchor="middle" font-size="11" opacity=".85">about 25 claims</text>
<line x1="480" y1="180" x2="558" y2="100" stroke="currentColor" marker-end="url(#a2)"></line>
<text x="508" y="130" font-size="11">kept</text>
<rect x="560" y="160" width="200" height="50" rx="6" fill="#fffefb" stroke="currentColor"></rect>
<text x="660" y="181" text-anchor="middle" font-weight="600" fill="#c2410c">Results log</text>
<text x="660" y="198" text-anchor="middle" font-size="11" opacity=".85">every attempt and why</text>
<line x1="480" y1="190" x2="558" y2="186" stroke="currentColor" marker-end="url(#a2)"></line>
<rect x="30" y="300" width="450" height="70" rx="8" fill="#fffefb" stroke="#5b564c" stroke-width="2"></rect>
<text x="255" y="324" text-anchor="middle" font-weight="600" fill="#5b564c">Threads, the wide web</text>
<text x="255" y="342" text-anchor="middle" font-size="11" opacity=".85">every line of inquiry not yet in the thesis, uncapped and unscored,</text>
<text x="255" y="356" text-anchor="middle" font-size="11" opacity=".85">where reverted and retired ideas land instead of being lost</text>
<line x1="380" y1="230" x2="380" y2="298" stroke="#5b564c" marker-end="url(#a2t)"></line>
<text x="388" y="268" font-size="11" fill="#5b564c">reverted</text>
<line x1="130" y1="300" x2="130" y2="224" stroke="#5b564c" marker-end="url(#a2t)"></line>
<text x="138" y="268" font-size="11" fill="#5b564c">next add drawn from here</text>
</g>
</svg>