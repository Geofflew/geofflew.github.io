<title id="title">Carry meaning into the answer</title><desc id="desc">Question-answering flow · model roles and application decisions. “Which deals included our forecasting product?”: A business question needs business definitions.; Forecasting means the product named Horizon: Select relevant context; propose SQL and state assumptions.; Check access, then examine interpretation: If revised, check the replacement SQL before it runs.; Run the checked query with restricted access: Read-only execution · timeout · overflow detection at the fetch cap; Show the result and what it covers: SQL · assumptions · missing data · partial-result status</desc>
