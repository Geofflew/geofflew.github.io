<text x="76" y="179" font-size="23" font-weight="500">Interpret the requested reassignment</text>
<text x="76" y="205" font-size="17" fill="#5b564c">Current owner · region · destination owner</text>
<path d="M360 226V251" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="52" y="256" width="616" height="98" rx="14" fill="#fffefb" stroke="#d8d0c2"/>
<text x="76" y="283" font-size="12" font-family="monospace" letter-spacing="1.1" fill="#c2410c">APPLICATION + DATABASE</text>
<text x="76" y="309" font-size="23" font-weight="500">Find accounts and save the exact proposal</text>
<text x="76" y="335" font-size="17" fill="#5b564c">Store account IDs, current owners, and proposed owners.</text>
