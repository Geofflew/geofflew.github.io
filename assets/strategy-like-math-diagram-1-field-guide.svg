<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="One agent proposes one edit to the thesis. The edit passes a source gate and a judge, is kept or reverted, and is logged." style="color:#1c1a16"><rect data-role="paper-background" x="0" y="0" width="900" height="300" fill="#faf8f3"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"></path></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="currentColor" stroke-width="1.5">
<rect x="30" y="110" width="150" height="70" rx="6" fill="#fffefb" stroke="currentColor" stroke-width="2"></rect>
<text x="105" y="140" text-anchor="middle" font-weight="600" fill="#c2410c">An agent</text>
<text x="105" y="160" text-anchor="middle" font-size="11" opacity=".85">proposes one edit</text>
<line x1="180" y1="145" x2="238" y2="145" stroke="currentColor" marker-end="url(#a1)"></line>
<text x="209" y="136" text-anchor="middle" font-size="11">one edit</text>
<rect x="240" y="30" width="270" height="240" rx="8" fill="#fffefb" stroke="#c2410c" stroke-width="2"></rect>
<text x="375" y="52" text-anchor="middle" font-weight="600" fill="#c2410c">Scorer, the reward</text>
<rect x="258" y="64" width="234" height="54" rx="5" fill="#fffefb" stroke="currentColor"></rect>
<text x="375" y="83" text-anchor="middle" font-weight="600" fill="#c2410c">1. Source gate, mechanical</text>
<text x="375" y="100" text-anchor="middle" font-size="11" opacity=".85">every page fetches, every quote is verbatim</text>
<line x1="375" y1="118" x2="375" y2="132" stroke="currentColor" marker-end="url(#a1)"></line>
<rect x="258" y="134" width="234" height="66" rx="5" fill="#fffefb" stroke="currentColor"></rect>
<text x="375" y="153" text-anchor="middle" font-weight="600" fill="#c2410c">2. Judge, a model with a rubric</text>
<text x="375" y="170" text-anchor="middle" font-size="11" opacity=".85">seven qualities scored 0 to 2, three readings,</text>
<text x="375" y="184" text-anchor="middle" font-size="11" opacity=".85">then a charge per claim and per 200 words</text>
<line x1="375" y1="200" x2="375" y2="214" stroke="currentColor" marker-end="url(#a1)"></line>
<rect x="258" y="216" width="234" height="40" rx="5" fill="#fffefb" stroke="currentColor"></rect>
<text x="375" y="241" text-anchor="middle" font-weight="600" fill="#c2410c">3. Keep if the score rose, else revert</text>
<rect x="600" y="80" width="200" height="60" rx="8" fill="#fffefb" stroke="currentColor" stroke-width="2"></rect>
<text x="700" y="105" text-anchor="middle" font-weight="600" fill="#c2410c">Thesis</text>
<text x="700" y="124" text-anchor="middle" font-size="11" opacity=".85">numbered claims with sources</text>
<line x1="510" y1="226" x2="598" y2="118" stroke="currentColor" marker-end="url(#a1)"></line>
<text x="548" y="162" font-size="11">kept</text>
<rect x="600" y="190" width="200" height="50" rx="6" fill="#fffefb" stroke="currentColor"></rect>
<text x="700" y="211" text-anchor="middle" font-weight="600" fill="#c2410c">Results log</text>
<text x="700" y="228" text-anchor="middle" font-size="11" opacity=".85">every attempt and why</text>
<line x1="510" y1="236" x2="598" y2="218" stroke="currentColor" marker-end="url(#a1)"></line>
<text x="548" y="240" font-size="11">logged</text>
</g>
</svg>