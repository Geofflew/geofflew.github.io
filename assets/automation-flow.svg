<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870" role="img" aria-labelledby="title desc">
<title id="title">Carry an approved change through</title><desc id="desc">Account reassignment · one workflow within an automation system. Interpret the requested reassignment: Current owner · region · destination owner; Find accounts and save the exact proposal: Store account IDs, current owners, and proposed owners.; Review the list and approve its proposal ID: Approval refers to the saved list, not a newly generated one.; Claim the proposal and apply eligible changes: Reject stale or repeated approval; recheck each current owner.; Report what changed and what needs attention: Applied accounts · accounts skipped because their owner changed</desc>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#d8d0c2"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#c2410c" stroke-width="1.3"/></marker></defs>
<rect width="720" height="870" fill="#faf8f3"/><rect width="720" height="870" fill="url(#dots)"/>
<rect x="24" width="672" height="870" fill="#faf8f3" stroke="#d8d0c2"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#1c1a16">
<text x="52" y="49" font-size="27" font-weight="600">Carry an approved change through</text>
